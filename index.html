<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #hud-container {
        position: fixed;
        bottom: 24px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        pointer-events: none;
        z-index: 999;
      }

      .hud-pill {
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        font-family: monospace;
        font-size: 13px;
        padding: 5px 14px;
        border-radius: 20px;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .hud-pill.visible {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div id="hud-container"></div>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item
          id="bearModel"
          src="./assets/Astronaut.glb"
        ></a-asset-item>
        <a-asset-item id="raccoonModel" src="./assets/Horse.glb"></a-asset-item>
      </a-assets>

      <a-camera id="cam" position="0 0 0"></a-camera>

      <a-entity id="target0" mindar-image-target="targetIndex: 0"></a-entity>
      <a-entity id="target1" mindar-image-target="targetIndex: 1"></a-entity>
    </a-scene>

    <script>
      const PERSIST_MS = 10000;
      const SCALE = 1.0;

      const configs = [
        { targetId: "target0", src: "#raccoonModel", label: "Horse" },
        { targetId: "target1", src: "#bearModel", label: "Astronaut" },
      ];

      const hudContainer = document.getElementById("hud-container");

      function makeHud(label) {
        const pill = document.createElement("div");
        pill.className = "hud-pill";
        hudContainer.appendChild(pill);

        return {
          show(msg) {
            pill.textContent = msg;
            pill.classList.add("visible");
          },
          hide() {
            pill.classList.remove("visible");
          },
        };
      }

      document.querySelector("a-scene").addEventListener("loaded", () => {
        const sceneEl = document.querySelector("a-scene");
        const cameraEl = document.getElementById("cam");

        configs.forEach(({ targetId, src, label }) => {
          const targetEl = document.getElementById(targetId);
          const hud = makeHud(label);

          const model = document.createElement("a-gltf-model");
          model.setAttribute("src", src);
          model.setAttribute("animation-mixer", "");
          model.setAttribute("visible", "false");

          sceneEl.appendChild(model);

          let isVisible = false;
          let lastSeenTime = 0;

          // LAST KNOWN POSITION STORAGE (KEY FIX)
          const lastPose = {
            position: new THREE.Vector3(),
            quaternion: new THREE.Quaternion(),
          };

          function updatePose() {
            targetEl.object3D.getWorldPosition(lastPose.position);
            targetEl.object3D.getWorldQuaternion(lastPose.quaternion);
          }

          function applyPose() {
            model.object3D.position.copy(lastPose.position);

            const camQuat = new THREE.Quaternion();
            cameraEl.object3D.getWorldQuaternion(camQuat);

            model.object3D.quaternion.copy(
              camQuat.multiply(lastPose.quaternion),
            );

            model.object3D.scale.set(SCALE, SCALE, SCALE);
          }

          function loop() {
            if (isVisible) {
              applyPose();
              requestAnimationFrame(loop);
            }
          }

          targetEl.addEventListener("targetFound", () => {
            isVisible = true;
            lastSeenTime = Date.now();

            model.setAttribute("visible", "true");

            updatePose();
            hud.show(`${label} · tracking`);

            loop();
          });

          targetEl.addEventListener("targetLost", () => {
            hud.show(`${label} · keeping position`);

            const check = () => {
              const elapsed = Date.now() - lastSeenTime;

              if (elapsed > PERSIST_MS) {
                model.setAttribute("visible", "false");
                isVisible = false;
                hud.hide();
                return;
              }

              // still keep model frozen in last known position
              applyPose();

              requestAnimationFrame(check);
            };

            requestAnimationFrame(check);
          });
        });
      });
    </script>
  </body>
</html>
