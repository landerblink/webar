<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2"
      vr-mode-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item
          id="bearModel"
          src="./assets/Astronaut.glb"
        ></a-asset-item>
        <a-asset-item id="horseModel" src="./assets/Horse.glb"></a-asset-item>
      </a-assets>

      <a-camera id="cam"></a-camera>

      <a-entity id="target0" mindar-image-target="targetIndex: 0"></a-entity>
      <a-entity id="target1" mindar-image-target="targetIndex: 1"></a-entity>
    </a-scene>

    <script>
      const PERSIST_MS = 10000;
      const SCALE = 1.0;

      const configs = [
        { targetId: "target0", src: "#horseModel" },
        { targetId: "target1", src: "#bearModel" },
      ];

      document.querySelector("a-scene").addEventListener("loaded", () => {
        const scene = document.querySelector("a-scene");
        const camera = document.getElementById("cam");

        configs.forEach(({ targetId, src }) => {
          const target = document.getElementById(targetId);

          const model = document.createElement("a-gltf-model");
          model.setAttribute("src", src);
          model.setAttribute("animation-mixer", "");
          model.setAttribute("visible", "false");
          scene.appendChild(model);

          let state = "idle"; // idle | tracking | lost
          let lastPose = {
            pos: new THREE.Vector3(),
            quat: new THREE.Quaternion(),
          };

          let lostTimer = null;

          function capturePose() {
            target.object3D.getWorldPosition(lastPose.pos);
            target.object3D.getWorldQuaternion(lastPose.quat);
          }

          function applyPose() {
            model.object3D.position.copy(lastPose.pos);

            const camQuat = new THREE.Quaternion();
            camera.object3D.getWorldQuaternion(camQuat);

            model.object3D.quaternion.copy(camQuat.multiply(lastPose.quat));

            model.object3D.scale.set(SCALE, SCALE, SCALE);
          }

          function updateLoop() {
            if (state === "tracking") {
              capturePose();
              applyPose();
              requestAnimationFrame(updateLoop);
            }

            if (state === "lost") {
              applyPose();
              requestAnimationFrame(updateLoop);
            }
          }

          target.addEventListener("targetFound", () => {
            state = "tracking";
            model.setAttribute("visible", "true");

            if (lostTimer) {
              clearTimeout(lostTimer);
              lostTimer = null;
            }

            capturePose();
            updateLoop();
          });

          target.addEventListener("targetLost", () => {
            state = "lost";

            lostTimer = setTimeout(() => {
              model.setAttribute("visible", "false");
              state = "idle";
            }, PERSIST_MS);

            updateLoop();
          });
        });
      });
    </script>
  </body>
</html>
