<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }

      #hud-container {
        position: fixed;
        bottom: 24px;
        left: 0; right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        pointer-events: none;
        z-index: 999;
      }

      .hud-pill {
        background: rgba(0,0,0,0.65);
        color: #fff;
        font-family: monospace;
        font-size: 13px;
        padding: 5px 14px;
        border-radius: 20px;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .hud-pill.visible { opacity: 1; }
    </style>
  </head>

  <body>
    <div id="hud-container"></div>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <a-assets>
        <a-asset-item id="bearModel" src="./assets/Astronaut.glb"></a-asset-item>
        <a-asset-item id="raccoonModel" src="./assets/Horse.glb"></a-asset-item>
      </a-assets>

      <a-camera id="cam" position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- TARGET 0 -->
      <a-entity id="target0" mindar-image-target="targetIndex: 0"></a-entity>

      <!-- TARGET 1 -->
      <a-entity id="target1" mindar-image-target="targetIndex: 1"></a-entity>

    </a-scene>

    <script>
      const PERSIST_MS = 10000;
      const DISPLAY_SCALE = 1.0; // 👈 FIXED SIZE (increase if still small)

      const configs = [
        { targetId: 'target0', src: '#raccoonModel', label: 'Horse' },
        { targetId: 'target1', src: '#bearModel', label: 'Astronaut' },
      ];

      const hudContainer = document.getElementById('hud-container');

      function makeHud(label) {
        const pill = document.createElement('div');
        pill.className = 'hud-pill';
        hudContainer.appendChild(pill);

        let intervalId = null;

        return {
          show(msg) {
            pill.textContent = msg;
            pill.classList.add('visible');
          },
          startCountdown(seconds, onTick, onDone) {
            if (intervalId) clearInterval(intervalId);

            let rem = seconds;
            onTick(rem);

            intervalId = setInterval(() => {
              rem--;
              if (rem > 0) onTick(rem);
              else {
                clearInterval(intervalId);
                intervalId = null;
                onDone();
              }
            }, 1000);
          },
          hide() {
            pill.classList.remove('visible');
            if (intervalId) clearInterval(intervalId);
          }
        };
      }

      document.querySelector('a-scene').addEventListener('loaded', () => {
        const sceneEl = document.querySelector('a-scene');
        const cameraEl = document.getElementById('cam');

        configs.forEach(({ targetId, src, label }) => {

          const targetEl = document.getElementById(targetId);
          const hud = makeHud(label);

          // world-locked model
          const cloneEl = document.createElement('a-gltf-model');
          cloneEl.setAttribute('src', src);
          cloneEl.setAttribute('animation-mixer', '');
          cloneEl.setAttribute('visible', 'false');

          sceneEl.appendChild(cloneEl);

          let hideTimer = null;
          let isPlaced = false;

          function cancelHide() {
            if (hideTimer) clearTimeout(hideTimer);
            hideTimer = null;
            hud.hide();
          }

          function placeClone() {
            const pos = new THREE.Vector3();
            const quat = new THREE.Quaternion();

            targetEl.object3D.getWorldPosition(pos);
            targetEl.object3D.getWorldQuaternion(quat);

            // IMPORTANT: NO CAMERA MATRIX (fixes drifting bug)
            cloneEl.object3D.position.copy(pos);

            const camQuat = new THREE.Quaternion();
            cameraEl.object3D.getWorldQuaternion(camQuat);

            cloneEl.object3D.quaternion.copy(camQuat.multiply(quat));

            cloneEl.object3D.scale.set(
              DISPLAY_SCALE,
              DISPLAY_SCALE,
              DISPLAY_SCALE
            );
          }

          function startLiveUpdate() {
            const loop = () => {
              if (!isPlaced) return;
              placeClone();
              requestAnimationFrame(loop);
            };
            loop();
          }

          targetEl.addEventListener('targetFound', () => {
            cancelHide();

            requestAnimationFrame(() => {
              requestAnimationFrame(() => {

                placeClone();
                cloneEl.setAttribute('visible', 'true');
                isPlaced = true;

                startLiveUpdate();

                hud.show(`${label} · tracking`);
              });
            });
          });

          targetEl.addEventListener('targetLost', () => {
            if (!isPlaced) return;

            const sec = Math.round(PERSIST_MS / 1000);

            hud.startCountdown(
              sec,
              (r) => hud.show(`${label} · hiding in ${r}s`),
              () => hud.hide()
            );

            hideTimer = setTimeout(() => {
              cloneEl.setAttribute('visible', 'false');
              isPlaced = false;
              hideTimer = null;
            }, PERSIST_MS);
          });

        });
      });
    </script>
  </body>
</html>
