<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      a-scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      #hud {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.6);
        color: white;
        padding: 6px 12px;
        border-radius: 20px;
        font-family: monospace;
        font-size: 13px;
        opacity: 0;
        transition: 0.2s;
      }

      #hud.show {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div id="hud"></div>

    <a-scene
      id="scene"
      mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="bearModel" src="./assets/Astronaut.glb"></a-asset-item>
        <a-asset-item id="horseModel" src="./assets/Horse.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target0" mindar-image-target="targetIndex: 0"></a-entity>
      <a-entity id="target1" mindar-image-target="targetIndex: 1"></a-entity>
    </a-scene>

    <script>
      // WAIT UNTIL AFRAME IS READY
      window.addEventListener("load", () => {
        const scene = document.querySelector("a-scene");
        const hud = document.getElementById("hud");

        const target0 = document.querySelector("#target0");
        const target1 = document.querySelector("#target1");

        let model0, model1;
        let timer0, timer1;

        function show(msg) {
          hud.textContent = msg;
          hud.classList.add("show");
        }

        function hide() {
          hud.classList.remove("show");
        }

        function spawnModel(target, modelId, src, timerRef) {
          let model = document.createElement("a-gltf-model");

          model.setAttribute("src", src);
          model.setAttribute("scale", "0.2 0.2 0.2");
          model.setAttribute("animation-mixer", "");

          scene.appendChild(model);

          // LOCK WORLD POSITION
          setTimeout(() => {
            const pos = new THREE.Vector3();
            target.object3D.getWorldPosition(pos);

            model.object3D.position.copy(pos);
          }, 0);

          return model;
        }

        // TARGET 0
        target0.addEventListener("targetFound", () => {
          clearTimeout(timer0);
          hide();

          if (!model0) {
            model0 = spawnModel(target0, "m0", "#horseModel");
          }
        });

        target0.addEventListener("targetLost", () => {
          let t = 10;
          show(`Model hides in ${t}s`);

          const interval = setInterval(() => {
            t--;
            show(`Model hides in ${t}s`);
            if (t <= 0) clearInterval(interval);
          }, 1000);

          timer0 = setTimeout(() => {
            if (model0) model0.setAttribute("visible", false);
            hide();
            clearInterval(interval);
          }, 10000);
        });

        // TARGET 1
        target1.addEventListener("targetFound", () => {
          clearTimeout(timer1);
          hide();

          if (!model1) {
            model1 = spawnModel(target1, "m1", "#bearModel");
          }
        });

        target1.addEventListener("targetLost", () => {
          let t = 10;
          show(`Model hides in ${t}s`);

          const interval = setInterval(() => {
            t--;
            show(`Model hides in ${t}s`);
            if (t <= 0) clearInterval(interval);
          }, 1000);

          timer1 = setTimeout(() => {
            if (model1) model1.setAttribute("visible", false);
            hide();
            clearInterval(interval);
          }, 10000);
        });
      });
    </script>
  </body>
</html>
