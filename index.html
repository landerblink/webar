<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />

    <title>MindAR Persistent AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Animation Support -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
      }

      body {
        position: fixed;
        inset: 0;
      }

      a-scene {
        position: fixed !important;
        inset: 0;
        width: 100vw !important;
        height: 100vh !important;
      }

      canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiScanning: true; uiLoading: true;"
      embedded="false"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- LIGHTS -->
      <a-light type="ambient" intensity="1"></a-light>

      <a-light
        type="directional"
        intensity="1"
        position="0 1 1"
      ></a-light>

      <!-- ASSETS -->
      <a-assets>
        <a-asset-item
          id="horseModel"
          src="./assets/Horse.glb"
        ></a-asset-item>

        <a-asset-item
          id="astronautModel"
          src="./assets/Astronaut.glb"
        ></a-asset-item>
      </a-assets>

      <!-- CAMERA -->
      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
      ></a-camera>

      <!-- TARGETS -->
      <a-entity
        id="target0"
        mindar-image-target="targetIndex: 0"
      >
      </a-entity>

      <a-entity
        id="target1"
        mindar-image-target="targetIndex: 1"
      >
      </a-entity>
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const scene = document.querySelector("a-scene");

        const target0 = document.querySelector("#target0");
        const target1 = document.querySelector("#target1");

        let spawned0 = false;
        let spawned1 = false;

        // =========================
        // TARGET 0
        // =========================
        target0.addEventListener("targetFound", () => {
          if (spawned0) return;

          const model = document.createElement("a-gltf-model");

          model.setAttribute("src", "#horseModel");

          model.setAttribute("position", "0 0 -2");

          model.setAttribute("rotation", "0 0 0");

          model.setAttribute("scale", "0.2 0.2 0.2");

          model.setAttribute("animation-mixer", "");

          scene.appendChild(model);

          spawned0 = true;
        });

        // =========================
        // TARGET 1
        // =========================
        target1.addEventListener("targetFound", () => {
          if (spawned1) return;

          const model = document.createElement("a-gltf-model");

          model.setAttribute("src", "#astronautModel");

          model.setAttribute("position", "0 0 -2");

          model.setAttribute("rotation", "0 0 0");

          model.setAttribute("scale", "0.2 0.2 0.2");

          model.setAttribute("animation-mixer", "");

          scene.appendChild(model);

          spawned1 = true;
        });

        // START MINDAR MANUALLY
        const arSystem = scene.systems["mindar-image-system"];

        scene.addEventListener("renderstart", () => {
          arSystem.start();
        });
      });
    </script>
  </body>
</html>
