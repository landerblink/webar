<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #hud {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 10px 16px;
        border-radius: 999px;
        font-family: monospace;
        font-size: 14px;
        z-index: 999;
      }
    </style>
  </head>

  <body>

    <div id="hud">
      Scan image target
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <a-assets>
        <a-asset-item
          id="astronautModel"
          src="./assets/Astronaut.glb">
        </a-asset-item>

        <a-asset-item
          id="horseModel"
          src="./assets/Horse.glb">
        </a-asset-item>
      </a-assets>

      <a-camera
        id="camera"
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <!-- IMAGE TARGETS -->
      <a-entity
        id="target0"
        mindar-image-target="targetIndex: 0">
      </a-entity>

      <a-entity
        id="target1"
        mindar-image-target="targetIndex: 1">
      </a-entity>

    </a-scene>

    <script>
      const hud = document.getElementById("hud");

      // prevents immediate re-trigger
      const RELOCK_DELAY_MS = 10000;

      const configs = [
        {
          targetId: "target0",
          modelSrc: "#horseModel",
          label: "Horse",
          scale: 1.2
        },
        {
          targetId: "target1",
          modelSrc: "#astronautModel",
          label: "Astronaut",
          scale: 1.0
        }
      ];

      document.querySelector("a-scene").addEventListener("loaded", () => {

        const sceneEl = document.querySelector("a-scene");

        configs.forEach((config) => {

          const targetEl = document.getElementById(config.targetId);

          let locked = false;
          let cooldown = false;

          targetEl.addEventListener("targetFound", () => {

            // already placed
            if (locked) return;

            // cooldown active
            if (cooldown) return;

            // wait 2 frames for stable tracking
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {

                const pos = new THREE.Vector3();
                const quat = new THREE.Quaternion();

                targetEl.object3D.getWorldPosition(pos);
                targetEl.object3D.getWorldQuaternion(quat);

                // CREATE MODEL
                const modelEl = document.createElement("a-gltf-model");

                modelEl.setAttribute("src", config.modelSrc);
                modelEl.setAttribute("animation-mixer", "");
                modelEl.setAttribute("position", pos);

                modelEl.object3D.quaternion.copy(quat);

                modelEl.setAttribute(
                  "scale",
                  `${config.scale} ${config.scale} ${config.scale}`
                );

                sceneEl.appendChild(modelEl);

                locked = true;

                hud.innerHTML =
                  `${config.label} placed in world`;

                console.log(config.label, "PLACED");
              });
            });

          });

          // IMPORTANT:
          // we DO NOTHING on targetLost
          // model remains permanently in world

          targetEl.addEventListener("targetLost", () => {

            // prevent instant retrigger spam
            cooldown = true;

            setTimeout(() => {
              cooldown = false;
            }, RELOCK_DELAY_MS);

          });

        });

      });
    </script>

  </body>
</html>
