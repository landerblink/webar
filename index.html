<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item
          id="bearModel"
          src="./assets/Astronaut.glb"
        ></a-asset-item>

        <a-asset-item id="raccoonModel" src="./assets/Horse.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model
          rotation="0 0 0"
          position="0 -0.25 0"
          scale="0.05 0.05 0.05"
          src="#raccoonModel"
          animation-mixer
        >
        </a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model
          rotation="0 0 0"
          position="0 -0.25 0"
          scale="0.05 0.05 0.05"
          src="#bearModel"
          animation-mixer
        >
        </a-gltf-model>
      </a-entity>
    </a-scene>
    <script>
  document.addEventListener("DOMContentLoaded", () => {
    const target0 = document.querySelector(
      '[mindar-image-target="targetIndex: 0"]'
    );

    const target1 = document.querySelector(
      '[mindar-image-target="targetIndex: 1"]'
    );

    let timeout0;
    let timeout1;

    // TARGET 0
    target0.addEventListener("targetFound", () => {
      clearTimeout(timeout0);

      target0.object3D.visible = true;
    });

    target0.addEventListener("targetLost", () => {
      clearTimeout(timeout0);

      timeout0 = setTimeout(() => {
        target0.object3D.visible = false;
      }, 10000); // 10 seconds
    });

    // TARGET 1
    target1.addEventListener("targetFound", () => {
      clearTimeout(timeout1);

      target1.object3D.visible = true;
    });

    target1.addEventListener("targetLost", () => {
      clearTimeout(timeout1);

      timeout1 = setTimeout(() => {
        target1.object3D.visible = false;
      }, 10000); // 10 seconds
    });
  });
</script>
  </body>
</html>
