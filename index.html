<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>WebAR Experience</title>

    <!-- A-Frame -->
    <script
      src="https://aframe.io/releases/1.6.0/aframe.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- MindAR -->
    <script
      src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"
      crossorigin="anonymous"
    ></script>

    <!-- Extras -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: black;
      }

      video {
        object-fit: cover !important;
      }
    </style>
  </head>

  <body>
    <!-- ===================== AR SCENE ===================== -->
    <a-scene
      id="ar-scene"
      mindar-image="
        imageTargetSrc: assets/targets.mind;
        autoStart: true;
        uiLoading: no;
        uiScanning: no;
        uiError: no;
        filterMinCF: 0.001;
        filterBeta: 0.01;
        warmupTolerance: 5;
      "
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
        antialias: true;
        precision: high;
        logarithmicDepthBuffer: true;
      "
    >
      <!-- CAMERA (MindAR controls this) -->
      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
        wasd-controls="enabled: false"
      ></a-camera>

      <!-- LIGHTING -->
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      <a-entity
        light="type: directional; intensity: 1.2"
        position="1 3 2"
      ></a-entity>

      <!-- ===================== TARGET 0 ===================== -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane
          position="0 0 0"
          width="1"
          height="0.6"
          color="#00e5ff"
          opacity="0.8"
        ></a-plane>

        <a-text
          value="TARGET 0"
          align="center"
          color="white"
          position="0 0.4 0"
          width="1.5"
        ></a-text>
      </a-entity>

      <!-- ===================== TARGET 1 ===================== -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-sphere
          radius="0.2"
          color="#ff6b35"
          position="0 0.2 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"
        ></a-sphere>
      </a-entity>

      <!-- ===================== TARGET 2 ===================== -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-box
          depth="0.2"
          height="0.2"
          width="0.2"
          color="#a855f7"
          position="0 0.2 0"
          animation="property: position; to: 0 0.4 0; dir: alternate; loop: true; dur: 1500"
        ></a-box>
      </a-entity>
    </a-scene>
  </body>
</html>
