<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #hud-container {
        position: fixed;
        bottom: 24px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        pointer-events: none;
        z-index: 999;
      }

      .hud-pill {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font-family: monospace;
        font-size: 13px;
        padding: 6px 14px;
        border-radius: 20px;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .hud-pill.visible {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div id="hud-container"></div>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="horseModel" src="./assets/Horse.glb"></a-asset-item>
        <a-asset-item
          id="astroModel"
          src="./assets/Astronaut.glb"
        ></a-asset-item>
      </a-assets>

      <a-camera
        id="cam"
        position="0 0 0"
        look-controls="enabled: false"
      ></a-camera>

      <a-entity id="target0" mindar-image-target="targetIndex: 0"></a-entity>
      <a-entity id="target1" mindar-image-target="targetIndex: 1"></a-entity>
    </a-scene>

    <script>
      // =========================================================
      // SETTINGS
      // =========================================================

      const DISPLAY_SCALE = 1.0;

      // how long before same target can scan again
      const RESCAN_COOLDOWN_MS = 10000;

      // =========================================================

      const configs = [
        {
          targetId: "target0",
          src: "#horseModel",
          label: "Horse",
        },
        {
          targetId: "target1",
          src: "#astroModel",
          label: "Astronaut",
        },
      ];

      const hudContainer = document.getElementById("hud-container");

      function makeHud() {
        const pill = document.createElement("div");
        pill.className = "hud-pill";
        hudContainer.appendChild(pill);

        return {
          show(text) {
            pill.textContent = text;
            pill.classList.add("visible");
          },
          hide() {
            pill.classList.remove("visible");
          },
        };
      }

      document.querySelector("a-scene").addEventListener("loaded", () => {
        const sceneEl = document.querySelector("a-scene");

        configs.forEach((cfg) => {
          const targetEl = document.getElementById(cfg.targetId);

          const hud = makeHud();

          // =====================================================
          // PERSISTENT WORLD MODEL
          // =====================================================

          const cloneEl = document.createElement("a-gltf-model");

          cloneEl.setAttribute("src", cfg.src);
          cloneEl.setAttribute("animation-mixer", "");
          cloneEl.setAttribute("visible", "false");

          sceneEl.appendChild(cloneEl);

          // =====================================================
          // STATE
          // =====================================================

          let cooldown = false;

          // =====================================================
          // PLACE MODEL ONCE
          // =====================================================

          function placeModel() {
            const pos = new THREE.Vector3();
            const quat = new THREE.Quaternion();

            targetEl.object3D.getWorldPosition(pos);
            targetEl.object3D.getWorldQuaternion(quat);

            // freeze world transform
            cloneEl.object3D.position.copy(pos);
            cloneEl.object3D.quaternion.copy(quat);

            cloneEl.object3D.scale.set(
              DISPLAY_SCALE,
              DISPLAY_SCALE,
              DISPLAY_SCALE,
            );

            cloneEl.setAttribute("visible", "true");
          }

          // =====================================================
          // TARGET FOUND
          // =====================================================

          targetEl.addEventListener("targetFound", () => {
            // ignore rescans during cooldown
            if (cooldown) return;

            cooldown = true;

            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                placeModel();

                hud.show(`${cfg.label} placed`);

                setTimeout(() => {
                  hud.hide();
                }, 1500);
              });
            });

            // unlock rescan later
            setTimeout(() => {
              cooldown = false;
            }, RESCAN_COOLDOWN_MS);
          });

          // =====================================================
          // IMPORTANT:
          // DO NOTHING ON targetLost
          // =====================================================

          targetEl.addEventListener("targetLost", () => {
            // intentionally empty
            // model remains permanently
            // no hiding
            // no reset
          });
        });
      });
    </script>
  </body>
</html>
